# Checks the umbrella repository: shell syntax of its scripts, the read-only installed-vs-repo check test, and that relative links in the Markdown exist.
# Runs on GitHub's servers with read-only permissions and no secrets.
name: checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: for f in scripts/*.sh scripts/preflight; do bash -n "$f" && echo "ok $f"; done
      - run: bash tests/test_check_installed.sh
      - name: relative links resolve
        run: |
          python3 - <<'PY'
          import re, pathlib, sys
          bad = 0
          for md in pathlib.Path('.').rglob('*.md'):
              for m in re.finditer(r'\]\((?!https?:|#|mailto:)([^)#\s]+)', md.read_text(errors='ignore')):
                  if not (md.parent / m.group(1)).exists():
                      print('broken link', md, '->', m.group(1)); bad += 1
          sys.exit(1 if bad else 0)
          PY
